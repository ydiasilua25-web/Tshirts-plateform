<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Scanner QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4">

  <h1 class="text-xl font-bold mb-4">Scanner un T-shirt</h1>

  <div id="reader" class="w-full max-w-md mx-auto"></div>

  <p id="result" class="mt-4 text-green-600 text-center"></p>

  <script>
    function onScanSuccess(decodedText) {
      document.getElementById("result").innerText =
        "QR détecté : " + decodedText;

      // Ici tu enverras au serveur plus tard
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 });

    html5QrcodeScanner.render(onScanSuccess);
  </script>

</body>
</html>
