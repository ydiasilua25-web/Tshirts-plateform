<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <h1 class="text-2xl font-bold mb-6">Voir les ventes</h1>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">Matete</h2>
      <p>120 ventes</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">Kasa-vubu</h2>
      <p>95 ventes</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">N’djili</h2>
      <p>70 ventes</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">Selembao</h2>
      <p>50 ventes</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">Bongolo</h2>
      <p>30 ventes</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">Matadi-mayo</h2>
      <p>20 ventes</p>
    </div>

  </div>

</body>
</html>
